# Realized Press — SotA LLM Phrasal Poetics & Kinetic Style Specification (BWE v1.3.1, ARC-104)
# Governs "--poetics" auditing in scripts/audit_manuscript.py and frozen-skeleton sculpting in bwe/style_sculptor.py.

version: "1.3.1"
language: "en"

thresholds:
  # Maximum ratio of sentences dominated by weak copulas/state-of-being verbs (is, are, was, were, has, have, becomes, provides, serves as)
  max_copula_ratio: 0.38
  # Maximum abstract Latinate nominalizations (-tion, -ment, -ity, -ance, -ence) in a single sentence (excluding whitelist)
  max_nominalizations_per_sentence: 2
  # Maximum formulaic LLM participial tail clauses (", highlighting...", ", underscoring...") per chapter
  max_participial_tail_drags_per_chapter: 2
  # Maximum formulaic LLM negation-pivot contrasts ("not only X, but Y" / "not merely X, but Y") per chapter
  max_negation_pivots_per_chapter: 3
  # Minimum sentence-length standard deviation (words) for paragraphs with >= 4 sentences
  min_cadence_sigma_words: 2.0
  # Optimal sentence-length standard deviation (words) rewarded by the poetics score
  target_cadence_sigma_words: 3.5
  # Minimum composite chapter Phrasal Poetics Score (0-100)
  min_poetics_score: 75.0

patterns:
  # Formulaic LLM participial tail drags at the end of a sentence
  participial_tail_drag_regex: ",\\s+(?:highlighting|underscoring|demonstrating|illustrating|shaping|reflecting|ensuring|fostering|cultivating|facilitating|emphasizing|reinforcing|revealing|showcasing)\\b[^.?!]*(?:[.?!]|$)"
  # Formulaic LLM negation-pivot ("not X, but Y" / "not merely X, but Y" / "less about X and more about Y")
  negation_pivot_regex: "\\b(?:not\\s+(?:merely|simply|just|only)\\s+[^,;.?!]{3,45},?\\s+but\\s+(?:rather|instead|also)?|less\\s+about\\s+[^,;.?!]{3,40}\\s+and\\s+more\\s+about)\\b"
  # Weak copula / state-of-being verb predicates
  copula_predicate_regex: "\\b(?:is|are|was|were|be|been|being|becomes|became|provides|provide|provided|serves\\s+as|served\\s+as|acts\\s+as|acted\\s+as|represents|represented|constitutes|constituted)\\b"
  # Abstract nominalization suffixes (evaluated on words >= 8 characters not in nominalization_whitelist)
  nominalization_suffix_regex: "\\b[a-z]{5,}(?:tion|tions|ment|ments|ity|ities|ance|ances|ence|ences|ness|nesses)\\b"

