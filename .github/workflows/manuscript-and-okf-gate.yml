name: Manuscript & OKF v0.3 Gate

on:
  pull_request:
    paths:
      - "series/**"
      - "scripts/**"
      - "style/**"
      - "bwe/**"
      - "SPEC.md"
      - "COMPOSITION.md"

permissions:
  contents: read

jobs:
  okf-and-manuscript-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyyaml
      - name: Run OKF v0.3 Five-Rule Check across all series and books
        run: |
          python3 scripts/five_rule_check.py series/architectures-of-memory/book-01-vanishing-signal --summary-only
          python3 scripts/five_rule_check.py series/architectures-of-memory/book-02-forget-gate --summary-only
          python3 scripts/five_rule_check.py series/architectures-of-memory/book-03-weight-of-attention --summary-only
          python3 scripts/five_rule_check.py series/architectures-of-memory/book-04-context-window --summary-only
          python3 scripts/five_rule_check.py series/architectures-of-memory/book-05-architecture-of-forgetting --summary-only
          python3 scripts/five_rule_check.py series/parenthood-atlas --summary-only
      - name: Run Manuscript Continuity, Style & Graph Audit across all books
        run: |
          python3 scripts/audit_manuscript.py series/architectures-of-memory/book-01-vanishing-signal --strict --graph-strict
          python3 scripts/audit_manuscript.py series/architectures-of-memory/book-02-forget-gate --strict --graph-strict
          python3 scripts/audit_manuscript.py series/architectures-of-memory/book-03-weight-of-attention --strict --graph-strict
          python3 scripts/audit_manuscript.py series/architectures-of-memory/book-04-context-window --strict --graph-strict
          python3 scripts/audit_manuscript.py series/architectures-of-memory/book-05-architecture-of-forgetting --strict --graph-strict
          python3 scripts/audit_manuscript.py series/parenthood-atlas --strict --graph-strict
          python3 scripts/audit_manuscript.py series/parenthood-atlas/i18n/es --strict --graph-strict --lang es
