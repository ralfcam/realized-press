<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="description" content="{% block meta_description %}Realized Press — Nonfiction Publishing Imprint &amp; Book Writing Environment (BWE){% endblock %}">
  <meta name="theme-color" content="#0c0a09">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{% block title %}Realized Press — Book Writing Environment{% endblock %}</title>

  <!-- Tailwind CSS CDN & R2 Design System Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            stone: {
              950: '#0c0a09',
              900: '#1c1917',
              800: '#292524',
              400: '#a8a29e',
              300: '#d6d3d1',
              100: '#f5f5f4',
            },
            amber: {
              400: '#fbbf24',
              500: '#f59e0b',
            },
            emerald: {
              400: '#34d399',
            },
            rose: {
              400: '#fb7185',
              500: '#f43f5e',
            },
          },
          fontFamily: {
            serif: ['Charter', 'Georgia', 'Cambria', '"Times New Roman"', 'Times', 'serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', '"Liberation Mono"', '"Courier New"', 'monospace'],
            sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- KaTeX Support -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script>
    function initKaTeX() {
      if (typeof renderMathInElement === "function") {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\(', right: '\\)', display: false},
            {left: '\\[', right: '\\]', display: true}
          ],
          throwOnError: false
        });
      }
    }
    document.addEventListener("DOMContentLoaded", initKaTeX);
    window.addEventListener("load", initKaTeX);
  </script>

  <!-- HTMX 2.0.4 -->
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>

  <!-- Alpine.js 3.14.8 -->
  <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>

  {% block head %}{% endblock %}
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen flex flex-col font-sans">
  {% include "partials/nav.html" %}

  <main class="flex-1 flex flex-col">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
