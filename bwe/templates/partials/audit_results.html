<!-- bwe/templates/partials/audit_results.html: Hardened Audit Results Display with ARIA -->
<div class="space-y-3" role="region" aria-live="polite" aria-label="Epistemic Audit Results">
  <div class="flex items-center justify-between p-3 rounded-lg border {{ 'bg-emerald-950/50 border-emerald-700/80 text-emerald-300' if returncode == 0 else 'bg-rose-950/50 border-rose-700/80 text-rose-300' }}">
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full {{ 'bg-emerald-400' if returncode == 0 else 'bg-rose-400 animate-ping' }}"></span>
      <span class="font-semibold text-xs sm:text-sm font-mono">{{ script_name }}.py</span>
    </div>
    <span class="px-2.5 py-1 rounded-full text-[11px] font-mono font-medium {{ 'bg-emerald-800 text-emerald-100' if returncode == 0 else 'bg-rose-800 text-rose-100' }}">
      {{ 'PASS (Exit 0)' if returncode == 0 else 'GATE FAILED (Exit ' ~ returncode ~ ')' }}
    </span>
  </div>

  {% if stdout %}
  <div class="space-y-1">
    <span class="text-[10px] uppercase tracking-wider text-stone-400 font-mono">Standard Output</span>
    <pre class="p-3 rounded-lg bg-stone-900/90 border border-stone-800 overflow-x-auto whitespace-pre-wrap text-stone-200 text-xs leading-relaxed font-mono overscroll-contain">{{ stdout }}</pre>
  </div>
  {% endif %}

  {% if stderr %}
  <div class="space-y-1">
    <span class="text-[10px] uppercase tracking-wider text-rose-400 font-mono">Diagnostic Output</span>
    <pre class="p-3 rounded-lg bg-rose-950/30 border border-rose-900/60 overflow-x-auto whitespace-pre-wrap text-rose-300 text-xs leading-relaxed font-mono overscroll-contain">{{ stderr }}</pre>
  </div>
  {% endif %}
</div>
