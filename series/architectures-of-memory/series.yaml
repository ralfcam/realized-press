schema_version: "1.1"
imprint: "Realized Press"
series_id: "architectures-of-memory"
title: "The Architectures of Memory"
subtitle: "Memory, Persistence, and Forgetting Across Machine Learning, Organizations, and Philosophy"
author: "Jose Campos"
linear:
  team_key: "ARC"
  team_id: "b507edbe-bdaa-4c47-8bdd-63af48774ebf"
  project_id: "3cae0985-8124-4f85-a959-6216cb041c81"
epistemic_contract:
  okf_version: "0.3"
  three_lenses:
    - id: "technical"
      label: "Technical"
      focus: "Mathematical derivations, neural architectures, retrieval benchmarks, privacy bounds"
    - id: "organizational"
      label: "Organizational"
      focus: "Institutional memory, documentation rot, GRC, incentives, team handoffs"
    - id: "philosophical"
      label: "Philosophical"
      focus: "Identity, duration, testimony, and the ethics of forgetting"
  target_chapter_words: [1100, 2500]
marketing_intelligence:
  target_personas:
    - "AI/ML Engineers, Staff Architects, and CTOs building long-context LLMs, RAG pipelines, and institutional knowledge systems"
    - "Engineering Leaders, GRC/Compliance Directors, and Organizational Designers diagnosing post-reorg amnesia and documentation rot"
    - "Readers of serious interdisciplinary nonfiction (Hofstadter, Gleick, Christian & Griffiths) seeking mathematical honesty without textbook dryness"
  high_intent_topic_clusters:
    - "Why long-context LLMs still lose information in the middle (Lost in the Middle / attention dilution)"
    - "How recurrent neural networks, LSTMs, and Transformers trade off compression vs. random-access retrieval"
    - "Why corporate wikis, runbooks, and compliance audits fail to preserve institutional memory across reorgs"
    - "Machine unlearning, differential privacy, and GDPR right-to-be-forgotten in foundation models"
  comp_title_gaps:
    - "AI history books (e.g., *Genius Makers*) tell biographical stories without deriving the underlying mathematical theorems (vanishing gradients, constant error carousels, softmax routing)."
    - "Management books on 'organizational learning' rely on unverified case-study anecdotes rather than information-theoretic and architectural mechanisms."
    - "Technical deep-learning textbooks omit the organizational and philosophical consequences of how memory and forgetting are engineered."
  telemetry_signals:
    - "Owned marketing site OKF Evidence Brief downloads & search queries per topic cluster"
    - "OpenAlex/Crossref citation velocity on long-context, RAG, and machine-unlearning benchmarks"
    - "Reader Edition beta completion & highlight density by lens (Technical vs. Organizational vs. Philosophical)"
monetization:
  kdp:
    role: "initial-release-channel-and-expansion-blueprint"
    expansion_channels: ["ingramspark", "apple-books", "kobo", "direct-storefront"]
    trim_size: "6x9" # 152.4mm x 228.6mm
    inside_gutter_mm: 20.0
    outside_margin_mm: 15.0
    top_bottom_margin_mm: 18.0
    formats: ["paperback-pdf", "hardcover-pdf", "kindle-epub", "audiobook-wav"]
    bisac_categories:
      - "COM004000" # Computers / Intelligence (AI) & Semantics
      - "BUS041000" # Business & Economics / Knowledge Capital
      - "PHI015000" # Philosophy / Mind & Body
    backend_keywords:
      - "transformer attention explained generation fine"
      - "retrieval augmented lstm forget gate multi head"
      - "mechanism visual explanation llm context window"
      - "large language models differential privacy deep"
      - "unlearning algorithms foundation gradient problem"
      - "neural networks carbon compute cost chinese room"
      - "gdpr forgotten backpropagation rnn ship theseus"
  owned_marketing_site:
    blueprint: "patreon-serial-membership-model"
    role: "internally-developed-marketing-and-serial-portal"
    tiers:
      - "Public Evidence Briefs & Interactive OKF Explorer (top-of-funnel marketing)"
      - "Chapter Preprints & Annotated Research Notes"
      - "Reader Edition 0.x Slices & Early Audiobook Narration"
