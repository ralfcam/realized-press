# series/parenthood-atlas/i18n/fr/series.yaml
# French (neutral international French, vouvoiement) localization of Parenthood: The Atlas.
# Canonical evidence layer (evidence-cards/, sources.bib, SOURCES.md) is SHARED with ../../ (parent series).
# Conforms to ARC-57 / ARC-98 (series.schema.json). Linear: ARC-108 / ARC-109.

slug: parenthood-atlas-fr
translation_of: parenthood-atlas
locale: fr
title: "L'Atlas de la parentalité"
subtitle: "Ce que démontre la science, ce qu'elle ignore encore et où commence l'art, de la conception à trois ans"
linear_project_id: P-ARC-17
version: v1.0.0

epistemic_contract: "Science -> Interpretation -> Art"
governing_principle: "Continuité sans détermination : rejeter à la fois la Genèse au moment où quelque chose devient visible et le Destin déjà scellé."

lenses:
  - biological
  - ecological
  - philosophical

readability_targets:
  language: fr
  max_avg_sentence_words: 20.5
  max_single_sentence_words: 38
  max_jargon_density_pct: 1.5
  kandel_min: 50.0
  kandel_moles_min: 50.0

okf_spec:
  version: "0.3"
  total_cards: 78
  stable_cards: 12
  locked_dois: 132
  retractions: 0
  genetically_informed_triangulation: true
  scaffolding_policy: "Prose épurée de tout échafaudage ; verbes calibrés au degré de certitude ; métadonnées OKF et jargon clinique isolés dans les ## Notes de chaque chapitre (clés structurelles Grade: et Evidence Card: conservées en anglais)."

audio_spec:
  sample_rate_bytes_per_sec: 48000
  pcm_cache_dir: ".cache/tts_pcm"
  auto_scroll_grace_timer_ms: 5000
  tts_model_chain:
    - gemini-2.5-pro-preview-tts
    - gemini-3.8-flash-tts
    - gemini-3.1-flash-tts-preview
    - gemini-2.5-flash-preview-tts

kdp_print_spec:
  trim_size: "6x9"
  wrap_cover_dimensions_in: "12.6216x9.2500"
  spine_width_in: 0.3716
  spine_width_mm: 9.44
  interior_pdf: "publishing/parenthood-atlas-kdp-6x9.pdf"
  cover_pdf: "publishing/parenthood-atlas-kdp-cover.pdf"

cover_art:
  layout_mode: front_hero_vignette
  style_preset: editorial-atlas-engraving
  aspect_ratio: "1:1"
  image_size: "2K"
  asset_path: "publishing/assets/cover-art.png"
  palette_bg_hex: "#111827"
  palette_accent_hex: "#D97706"
  palette_text_hex: "#F9FAFB"
  prompt: >-
    Fine-line celestial and botanical natural-history atlas engraving in burnished gold (#D97706),
    warm terracotta, and antique ivory on a deep midnight-slate background (#111827), depicting
    three concentric developmental rings: intricate cellular and placental roots at the inner core,
    a luminous relational caregiver-and-infant silhouette in gentle co-regulating motion at the center,
    and a branching neural and ecological canopy radiating outward like a precision star chart.

publishing_copy:
  series_header: "REALIZED PRESS  |  VOLUME I"
  badge: "15 chapitres  |  78 fiches de preuves\nScience du développement rigoureusement calibrée"
  category_line: "NON-FICTION  /  SCIENCE DU DÉVELOPPEMENT  /  PARENTALITÉ"
  back_title: "Un atlas d'histoire naturelle des 1 000 premiers jours"
  features_header: "ATTRIBUTS ÉPISTÉMIQUES CLÉS :"
  features:
    - "- 15 chapitres de développement, de la préconception à trois ans."
    - "- Verbes d'affirmation calibrés selon le degré de certitude des preuves."
    - "- Audits de confusion génétique (GI) sur les 78 fiches de preuves."
    - "- Régulé par l'Open Knowledge Format (OKF v0.3) et DOIs verrouillés."
  colophon: "Édition française (Gold-Master)"
  blurb:
    - "L'Atlas de la parentalité est une cartographie longitudinale des preuves scientifiques sur le développement de l'enfant, depuis environ un an avant la conception jusqu'à l'âge de trois ans. Il distingue trois registres qu'il ne faut jamais confondre : ce que la science peut observer, ce que l'interprétation suggère et ce que l'art relationnel du soin exige."
    - "Loin des manuels prescriptifs ou des alertes sensationnalistes fondées sur une seule étude, cet ouvrage dresse une carte d'histoire naturelle à travers quinze jalons développementaux. Chaque affirmation est calibrée selon le degré de certitude empirique vérifié sous l'Open Knowledge Format."
    - "Du filtre placentaire du cortisol maternel à l'émergence des tours de parole, de la physiologie de la transition néonatale à la mécanique fragile de l'autorégulation du jeune enfant, L'Atlas offre aux mères, pères et professionnels un socle rigoureux, ancré dans les données probantes."

marketing_intelligence:
  target_personas:
    - "Futurs et jeunes parents (0–36 mois) lassés des dogmes contradictoires et des affirmations non calibrées"
    - "Pédiatres, psychologues du développement, professionnels de la petite enfance et éducateurs en quête de repères causaux vérifiés"
    - "Lecteurs d'Alison Gopnik et d'Emily Oster recherchant des audits méthodologiques explicites de confusion génétique et de réplication"
  high_intent_topic_clusters:
    - "Sommeil du nourrisson, méthode 5-10-15, cortisol et attachement"
    - "Diversification alimentaire menée par l'enfant (DME), allergènes et arachide"
    - "Écrans avant 3 ans, tours de parole et développement du langage"
    - "Modes d'accueil, crèche collective ou assistante maternelle, colères et corégulation"
  comp_title_gaps:
    - "Les manuels de parentalité idéologiques présentent des corrélations observationnelles comme des vérités déterministes culpabilisantes."
    - "Les guides pragmatiques omettent d'auditer la confusion génétique (conceptions avec frères et sœurs, jumeaux, adoption)."
    - "Les traités universitaires manquent d'une synthèse vivante distinguant Science, Interprétation et Art clinique parental."
  telemetry_signals:
    - "Demande de recherche en français (France, Belgique, Suisse, Québec) validée sur Google Keyword Planner"
    - "Retours des lecteurs de l'Édition de lecture pour les chapitres 01–15"

