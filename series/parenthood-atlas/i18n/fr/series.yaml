    role: "regional-edition-fr"
    marketplaces: ["amazon.fr", "amazon.ca", "amazon.com"]
    trim_size: "6x9"
    inside_gutter_mm: 20.0
    outside_margin_mm: 15.0
    top_bottom_margin_mm: 18.0
    formats: ["paperback-pdf", "kindle-epub", "audiobook-wav"]
    bisac_categories:
      - "FAM034000"
      - "PSY004000"
      - "SCI049000"
    backend_keywords:
      - "sommeil bebe rgo dme diversification autonome"
      - "crise de colere 2 ans caprice morsure regles"
      - "creche assistante maternelle attachement pmi"
      - "langage retard parole ecrans tours de parole"
      - "montessori motricite libre jeux d imitation"
      - "conge paternite maternite reprise travail cafe"
      - "folates acide folique alcool grossesse stress"

