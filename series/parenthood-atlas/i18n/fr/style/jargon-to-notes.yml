# series/parenthood-atlas/i18n/fr/style/jargon-to-notes.yml
# Architecture à registre divisé (ARC-71 / ARC-72), version française (ARC-108 / ARC-109).
# Termes cliniques et méthodologiques qui doivent résider dans les `## Notes` de chaque chapitre,
# jamais dans la prose narrative principale. La correspondance est par sous-chaîne insensible à la casse.

max_avg_sentence_words: 20.5
max_single_sentence_words: 38

relocate_to_notes:
  syncytiotrophoblaste: "couche externe protectrice du placenta"
  morphogénétique: "de formation précoce des structures corporelles"
  morphogénétiques: "de formation précoce des structures corporelles"
  morphogenèse: "manière dont les organes se forment et se déploient"
  spermatogonial: "relatif aux cellules souches produisant les spermatozoïdes"
  spermatogoniale: "relatif aux cellules souches produisant les spermatozoïdes"
  gamétogenèse: "formation des ovocytes et des spermatozoïdes"
  organogenèse: "semaines décisives de formation des organes"
  gastrulation: "repliement précoce des feuillets embryonnaires"
  fronto-striatal: "circuit cérébral du contrôle et du frein moteur"
  frontostriatal: "circuit cérébral du contrôle et du frein moteur"
  équifinalité: "plusieurs chemins différents menant au même résultat développemental"
  équifinale: "l'une des voies possibles vers un même résultat"
  continuité hétérotypique: "un même trait sous-jacent qui s'exprime sous des formes différentes avec l'âge"
  confusion évocatrice: "manière dont le tempérament de l'enfant suscite des réactions distinctes chez les adultes"
  épiphénoménal: "un effet secondaire ou indirect, et non le moteur causal principal"
  épiphénomène: "un effet secondaire ou indirect, et non le moteur causal principal"
  appariement sélectif: "tendance des partenaires partageant des traits similaires à s'unir"
  appariement assortatif: "tendance des partenaires partageant des traits similaires à s'unir"
  tératologique: "susceptible d'altérer la morphologie fœtale"
  tératogène: "substance ou agent toxique pour le développement embryonnaire"
  vasoconstricteur: "substance provoquant le rétrécissement des vaisseaux sanguins"
  hydroxystéroïde: "enzyme barrière placentaire spécialisée"
  "11β-hsd2": "enzyme bouclier du placenta (conserver le symbole exact 11β-HSD2 dans les ## Notes)"
  "11\\beta": "enzyme bouclier du placenta (conserver le symbole exact 11β-HSD2 dans les ## Notes)"
  inter-salve: "pauses naturelles entre les salves de succion"
  contrôle opérant: "ajustement actif (ex. moduler le rythme de succion pour choisir un son)"
  arborisation: "ramification des prolongements neuronaux"
  synaptogenèse: "tissage des connexions entre neurones"
  habituation-déshabituation: "protocole de mesure de l'attention visuelle jusqu'à satiété"
  dorsolatéral: "région supérieure du cortex frontal"
  couplage perception-action: "boucle d'ajustement mutuel entre regard et geste"
  proprioception: "perception interne de la posture et du corps dans l'espace"
  faisceau arqué: "pont neuronal reliant la compréhension auditive à l'articulation"
  canonique rédupliqué: "babillage avec répétition de syllabes bien formées (ex. ba-ba-ba)"
  perception phonétique catégorielle: "classification des sons continus en phonèmes distincts"
  sensibilité dyadique: "accordage affectif mutuel entre parent et nourrisson"
  sélection endogène: "biais où les familles favorisées accèdent à des contextes différents"
  réactivité amygdalienne: "activation du centre cérébral de vigilance émotionnelle"
  arousal autonomique: "mobilisation physiologique face au stress"
  arousal: "mobilisation physiologique ou éveil neurovégétatif"
  asymétrie électroencéphalographique: "différence d'activité électrique entre hémisphères cérébraux"
  renforcement négatif de patterson: "piège d'escalade où céder à la crise renforce l'opposition"
  internalisation autorégulée: "adhésion volontaire aux règles sans surveillance constante"
  dccs: "test de tri de cartes selon la couleur ou la forme"
  décentration symbolique: "capacité à faire semblant en détachant un objet de son usage réel"
  étayage pédagogique: "soutien structuré d'un adulte qui ajuste son aide au besoin"
  multifinalité: "manière dont un même point de départ mène à des trajectoires divergentes"
  continuité homotypique: "persistance d'un symptôme ou comportement identique dans le temps"

anti_leakage_patterns:
  inline_md_filename: "\\b[a-z0-9-]+\\.md\\b"
  backticked_footnote: "`\\[\\^[^\\]]+\\]`"
  harness_meta_escalation: "\\bescalade progressive des prismes\\b"
  harness_meta_three_tier: "\\b(résolution causale à trois niveaux|au (premier|deuxième|troisième) niveau)\\b"
