# Realized Press — Especificación de Poética Frasal y Estilo Cinético (BWE v1.3.1, ARC-104)
# Gobierna la auditoría "--poetics" en scripts/audit_manuscript.py y el esculpido en bwe/style_sculptor.py para español (ES).

version: "1.3.1"
language: "es"

thresholds:
  max_copula_ratio: 0.40
  max_nominalizations_per_sentence: 3
  max_participial_tail_drags_per_chapter: 2
  max_negation_pivots_per_chapter: 3
  min_cadence_sigma_words: 2.0
  target_cadence_sigma_words: 3.5
  min_poetics_score: 75.0

patterns:
  participial_tail_drag_regex: ",\\s+(?:destacando|subrayando|demostrando|ilustrando|reflejando|asegurando|fomentando|facilitando|enfatizando|revelando|evidenciando)\\b[^.?!]*(?:[.?!]|$)"
  negation_pivot_regex: "\\b(?:no\\s+(?:solo|solamente|meramente|únicamente|simplemente)\\s+[^,;.?!]{3,45},?\\s+sino\\s+(?:también|más\\s+bien|además)?|menos\\s+de\\s+[^,;.?!]{3,40}\\s+y\\s+más\\s+de)\\b"
  copula_predicate_regex: "\\b(?:es|son|era|eran|fue|fueron|sea|sean|sido|siendo|está|están|estaba|estaban|constituye|constituyen|representa|representan|sirve\\s+como|actúa\\s+como)\\b"
  nominalization_suffix_regex: "\\b[a-záéíóúñ]{6,}(?:ción|ciones|miento|mientos|dad|dades|ancia|ancias|encia|encias)\\b"

